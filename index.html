<style>
    html, body, #root { margin: 0; padding: 0; height: 100%; background: #0a0a0e; color: #fff; }
    body { font-family: Manrope, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    /* Soft cross-fade for trilingual labels driven by React state.
       (Old keyframe-based entry was getting restarted by parent re-renders
       and never reached opacity 1 — replaced with transition.) */
    .rot-label { display: inline-block; }

    /* Background halo drift */
    .halo-a { animation: haloA 28s ease-in-out infinite alternate; }
    .halo-b { animation: haloB 36s ease-in-out infinite alternate; }
    @keyframes haloA {
      0%   { transform: translate(-40px, -20px) scale(1); opacity: 0.85; }
      100% { transform: translate(60px, 80px) scale(1.15); opacity: 1; }
    }
    @keyframes haloB {
      0%   { transform: translate(20px, 30px) scale(0.95); opacity: 0.8; }
      100% { transform: translate(-80px, -60px) scale(1.1); opacity: 1; }
    }

    /* Sun pulse */
    .sun-pulse { animation: sunPulse 6s ease-in-out infinite; }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1);    filter: brightness(1); }
      50%      { transform: scale(1.04); filter: brightness(1.12); }
    }

    /* Cloud drift */
    .cloud-drift { animation: cloudDrift 24s ease-in-out infinite alternate; transform-origin: center; }
    @keyframes cloudDrift {
      0%   { transform: translateX(-6px); }
      100% { transform: translateX(8px); }
    }

    /* Rain stroke pulse */
    .rain-stroke { animation: rainStroke 0.9s linear infinite; transform-origin: top; }
    @keyframes rainStroke {
      0%   { transform: translateY(-8px) scaleY(0.6); opacity: 0; }
      40%  { opacity: 1; }
      100% { transform: translateY(20px) scaleY(1.2); opacity: 0; }
    }

    /* Snowflake glyph drift */
    .snow-glyph { animation: snowGlyph 3.5s ease-in-out infinite; }
    @keyframes snowGlyph {
      0%, 100% { transform: translate(0,0) rotate(0); opacity: 0.85; }
      50%      { transform: translate(-3px, 6px) rotate(20deg); opacity: 1; }
    }

    /* Big hero temperature subtle breath */
    .hero-temp { animation: heroBreath 9s ease-in-out infinite; }
    @keyframes heroBreath {
      0%, 100% { letter-spacing: -0.04em; opacity: 1; }
      50%      { letter-spacing: -0.038em; opacity: 0.97; }
    }

    /* Rotating views: 800ms cross-fade, opacity only */
    .view-fade {
      transition: opacity 800ms ease;
      will-change: opacity;
    }

    /* LIVE dot soft pulse */
    @keyframes livePulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }

    /* LIVE pill radiating ring */
    @keyframes liveRing {
      0%   { transform: scale(1);   opacity: 0.55; }
      70%  { transform: scale(2.6); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* Today marker on the forecast bar */
    @keyframes todayPulse {
      0%, 100% { box-shadow: 0 0 18px rgba(255,255,255,0.9), 0 0 6px rgba(255,255,255,1); }
      50%      { box-shadow: 0 0 28px rgba(255,255,255,1),   0 0 10px rgba(255,255,255,1); }
    }

    /* Today's-arc overlays: gentle staggered rise-in (re-keyed each time the
       view becomes active so the reveal replays on every loop) */
    @keyframes todayRise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .today-rise { animation: todayRise 1100ms cubic-bezier(.16,.84,.36,1) both; }
    @keyframes nowFloat {
      0%, 100% { transform: translate(-50%, 0); }
      50%      { transform: translate(-50%, -6px); }
    }
  </style>

(function(){
  var _fetch = window.fetch.bind(window);
  window.__qvNetOK = 0;

    init = init || {};
    var ctrl, t;
    try{

      init.signal = ctrl.signal;

      return r;
    }, function(err){ if(t) clearTimeout(t); throw err; });
  };
})();

<script id="qv-resilience-post">
/* Hardening layer: offline badge + white-screen watchdog + periodic refresh. */
(function(){
  var STALE_MS     = 30*60*1000;
  var WATCH_START  = 25000;
  var HARD_REFRESH = 6*60*60*1000;
  var badge = document.createElement("div");
  badge.id = "qv-badge";
  badge.innerHTML = "OFFLINE \u00b7 <b>showing last update</b>";
  function updateBadge(){
    var ok = window.__qvNetOK || 0;
    var stale = !navigator.onLine || (ok && (Date.now() - ok) > STALE_MS);
    badge.style.display = stale ? "block" : "none";
  }
  function boot(){
    document.body.appendChild(badge);
    setInterval(updateBadge, 15000);
    updateBadge();
    window.addEventListener("online",  updateBadge);
    window.addEventListener("offline", updateBadge);
  }
  if(document.body) boot(); else window.addEventListener("DOMContentLoaded", boot);
  setTimeout(function(){
    var root = document.getElementById("root");
    if(!root || root.childElementCount === 0){ location.reload(); }
  }, WATCH_START);
  setTimeout(function(){ location.reload(); }, HARD_REFRESH);
})();
</script>
